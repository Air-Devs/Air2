name: Build IPA

# 出可安装的未签名 IPA。
# 没有 Apple 开发者证书时走这条路：
#   CI 用 CODE_SIGNING_ALLOWED=NO 编译 → 产出未签名 .app → 手动包成 ipa
#   用户拿到后用 AltStore / Sideloadly / TrollStore 自行签名安装。

on:
  push:
    branches: [ main, dev, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # 规范检查 —— 挡住"石山代码"
  # ============================================================
  lint:
    name: 规范检查
    runs-on: ubuntu-latest
    steps:
      # ★必须拉子模块★
      # check_imports.py 会扫 Libraries/external/ 下的头文件
      # （MobileGlues 的 glslang 等）。不拉子模块时那些目录是空的，
      # 于是判定「引用了不存在的头文件」→ lint 失败，
      # 而本地因为子模块齐全一直是绿的。
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 目录与命名规范
        run: bash scripts/lint_structure.sh

      - name: 校验头文件引用
        run: python3 scripts/check_imports.py

      - name: 校验 Xcode 工程完整性
        run: python3 scripts/verify_pbxproj.py

  # ============================================================
  # 编译并打包 IPA
  # ============================================================
  build:
    name: 编译打包
    runs-on: macos-15
    needs: lint
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # ★CI 必须拉子模块★ 否则 Libraries/external/{fishhook,AFNetworking,
          # DBNumberedSlider,ZeroTierFramework} 是空壳目录，编译时报：
          #   Air2/Player/Context/main_hook.m:26 'external/fishhook/fishhook.h' file not found
          # （这些路径是 gitlink，actions/checkout 默认不初始化子模块）
          submodules: recursive

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 重新生成工程文件
        run: python3 scripts/gen_xcodeproj.py

      - name: 校验工程
        run: python3 scripts/verify_pbxproj.py

      - name: 下载预编译依赖
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 246MB 动态库 + jar。不进 git，用脚本按准确大小校验下载。
          # 必须走镜像：raw.githubusercontent.com 对大文件会静默截断
          # （实测 8 个文件被截断过，最严重的只下到 6%）
          python3 scripts/fetch_deps.py

      - name: 下载 JRE
        run: |
          # 4 个版本（8/17/21/25）共 440MB
          python3 scripts/fetch_jre.py

      - name: 编译（未签名）
        run: |
          set -o pipefail
          mkdir -p logs
          xcodebuild \
            -project Air2.xcodeproj \
            -scheme Air2 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build 2>&1 | tee logs/xcodebuild.log

      - name: 汇总编译错误
        if: failure()
        run: |
          echo "===== 编译错误摘要 ====="
          grep -E "error:" logs/xcodebuild.log | head -50 || true

      - name: 注入 Frameworks 与 JRE 并打包
        if: success()
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::找不到编译产物 .app"
            exit 1
          fi
          echo "产物: $APP"

          # ---- 注入动态库 ----
          mkdir -p "$APP/Frameworks"
          cp Libraries/Frameworks/*.dylib "$APP/Frameworks/" 2>/dev/null || true
          for f in Libraries/Frameworks/*.framework; do
            [ -d "$f" ] && cp -R "$f" "$APP/Frameworks/"
          done

          # ---- 注入 JRE ----
          # ★fetch_jre.py 落盘在 depends/java-<v>-openjdk，打包需要根目录 java_runtimes/★
          #   之前直接 cp java_runtimes 失败：cp: java_runtimes: No such file or directory
          mkdir -p java_runtimes
          for v in 8 17 21 25; do
            src="depends/java-${v}-openjdk"
            [ -d "$src" ] && cp -R "$src" java_runtimes/
          done
          ls java_runtimes | head -10
          cp -R java_runtimes "$APP/java_runtimes"

          # ---- 启动器资源 ----
          for f in Assets/runtime/*; do
            b=$(basename "$f")
            case "$b" in Frameworks|*.lproj) continue ;; esac
            cp -R "$f" "$APP/" 2>/dev/null || true
          done

          # ---- 统计 ----
          echo "== 注入后体积 =="
          du -sh "$APP/Frameworks" 2>/dev/null || echo "  Frameworks: 0"
          du -sh "$APP/java_runtimes" 2>/dev/null || echo "  JRE: 0"

          # ---- ad-hoc 签名（TrollStore 可用）----
          find "$APP/Frameworks" -name '*.dylib' -exec codesign -f -s - {} \; 2>/dev/null || true
          codesign -f -s - --deep "$APP" 2>/dev/null || true

          # ---- 打包 ----
          mkdir -p artifacts/Payload
          cp -R "$APP" artifacts/Payload/
          cd artifacts
          zip -qry Air2-unsigned.ipa Payload
          rm -rf Payload

          # ---- 体积校验 ----
          SIZE_MB=$(( ($(stat -f%z Air2-unsigned.ipa 2>/dev/null || stat -c%s Air2-unsigned.ipa)) / 1048576 ))
          echo "IPA: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -lt 50 ]; then
            echo "::error::IPA 只有 ${SIZE_MB} MB，Frameworks/JRE 没注入成功"
            ls -la "$APP/Frameworks" | head -20
            exit 1
          fi
          ls -lh Air2-unsigned.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Air2-IPA
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            logs/*.log
          if-no-files-found: warn
          retention-days: 7

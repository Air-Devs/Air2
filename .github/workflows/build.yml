name: Build IPA

# 出可安装的未签名 IPA。
# 没有 Apple 开发者证书时走这条路：
#   CI 用 CODE_SIGNING_ALLOWED=NO 编译 → 产出未签名 .app → 手动包成 ipa
#   用户拿到后用 AltStore / Sideloadly / TrollStore 自行签名安装。

on:
  push:
    branches: [ main, dev, 'feat/**', 'fix/**' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # 规范检查 —— 挡住"石山代码"
  # ============================================================
  lint:
    name: 规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 目录与命名规范
        run: bash scripts/lint_structure.sh

      - name: 校验 Xcode 工程完整性
        run: python3 scripts/verify_pbxproj.py

  # ============================================================
  # 编译并打包 IPA
  # ============================================================
  build:
    name: 编译打包
    runs-on: macos-15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 重新生成工程文件
        run: python3 scripts/gen_xcodeproj.py

      - name: 校验工程
        run: python3 scripts/verify_pbxproj.py

      - name: 编译（未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project Air2.xcodeproj \
            -scheme Air2 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build \
            | xcbeautify --renderer github-actions 2>/dev/null \
            || xcodebuild \
                -project Air2.xcodeproj \
                -scheme Air2 \
                -configuration Release \
                -sdk iphoneos \
                -derivedDataPath build \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                ONLY_ACTIVE_ARCH=NO \
                ARCHS=arm64 \
                build

      - name: 打包 IPA
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::找不到编译产物 .app"
            find build/Build/Products -maxdepth 3 -type d | head -20
            exit 1
          fi
          echo "产物: $APP"
          mkdir -p artifacts/Payload
          cp -R "$APP" artifacts/Payload/
          cd artifacts
          zip -qry Air2-unsigned.ipa Payload
          rm -rf Payload
          ls -lh Air2-unsigned.ipa

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Air2-IPA
          path: artifacts/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/Logs
          if-no-files-found: warn
          retention-days: 7
